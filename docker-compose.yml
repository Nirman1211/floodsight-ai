version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CDSE_USERNAME=${CDSE_USERNAME:-}
      - CDSE_PASSWORD=${CDSE_PASSWORD:-}
    volumes:
      - ./backend/data:/app/backend/data
      - ./ml/checkpoints:/app/ml/checkpoints
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
